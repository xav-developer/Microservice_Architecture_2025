services:

    php:
        build:
            context: .
            dockerfile: Dockerfile
            target: compose
            args:
                UID: ${UID}
                GID: ${GID}
        volumes:
            - ./html:/var/www/html/:rw
        ports:
            -   target: 8000
                published: 8000
        depends_on:
            - postgres
        networks:
            private:

    postgres:
        image: postgres:17.7-trixie
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres:/var/lib/postgresql/data:rw
        networks:
            private:

volumes:
    postgres:
        name: otus_msa_2025_postgres

networks:
    private:
        name: otus-msa-2025
        driver: bridge
