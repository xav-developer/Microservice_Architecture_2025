apiVersion: apps/v1
kind: Deployment
metadata:
    name: msa
    labels:
        app: msa
spec:
    replicas: 3
    selector:
        matchLabels:
            app: msa
    template:
        metadata:
            labels:
                app: msa
        spec:
            containers:
                -   name: msa
                    image: phexel/msa:latest
                    livenessProbe:
                        httpGet:
                            path: /health
                            port: 8000
                        initialDelaySeconds: 10
                        periodSeconds: 5
                        timeoutSeconds: 3
                        successThreshold: 1
                        failureThreshold: 3
                    readinessProbe:
                        httpGet:
                            path: /health
                            port: 8000
                        initialDelaySeconds: 10
                        periodSeconds: 5
                        timeoutSeconds: 3
                        successThreshold: 1
                        failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
    name: msa
spec:
    selector:
        app: msa
    ports:
        -   port: 80
            targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: msa
spec:
    ingressClassName: traefik
    rules:
        -   host: arch.homework
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: msa
                                port:
                                    number: 80
