apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: authorization
    namespace: fa
spec:
    forwardAuth:
        address: http://authorization.local/api/me
        trustForwardHeader: true
        authResponseHeaders:
            - X-API-KEY
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: authorization
    namespace: fa
spec:
    ingressClassName: traefik
    rules:
        -   host: authorization.local
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: authorization-authorization
                                port:
                                    number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: profile
    namespace: fa
    annotations:
        traefik.ingress.kubernetes.io/router.middlewares: fa-authorization@kubernetescrd
spec:
    ingressClassName: traefik
    rules:
        -   host: profile.local
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: profile-profile
                                port:
                                    number: 80
